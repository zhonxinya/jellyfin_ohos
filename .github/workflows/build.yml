name: HarmonyOS CI

# 触发条件：代码推送、PR 提交、手动触发
on:
  push:
    branches: ["main", "master", "dev", "develop"]
  pull_request:
    branches: ["main", "master", "dev", "develop"]
  workflow_dispatch:

# 最小权限：构建仅需读取仓库内容，上传产物使用 Actions 内置机制而非 GITHUB_TOKEN
permissions:
  contents: read

# 同一分支的重复推送取消上一次未完成的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: C++ 核心单测（主机）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # native/core 的单测是纯主机侧测试（不依赖 HarmonyOS SDK 与设备）：
      # 每个测试文件自带 main()，按需链接被测实现后直接运行。
      - name: Build and run native/core tests
        shell: bash
        run: |
          set -euo pipefail
          INC="-I native/core -I native/core/api -I native/feature/player -I native/third_party -I native/third_party/nlohmann"
          OUT="$(mktemp -d)"
          fail=0

          for test_src in native/core/tests/test_*.cpp; do
            name="$(basename "$test_src" .cpp)"
            case "$name" in
              test_url_util)
                extra="native/core/url_util.cpp" ;;
              test_http_response)
                extra="native/core/http_response.cpp" ;;
              test_image_url)
                extra="native/core/image_url.cpp native/core/url_util.cpp" ;;
              test_items_query)
                # options_parse.cpp：宿主 JSON → ItemsQuery/PlaybackInfoOptions 的容错解析
                # （用 nlohmann 的 value() 会在"键存在但类型不符"时抛异常，见 json_arg.h）
                extra="native/core/api/items_query.cpp native/core/api/options_parse.cpp native/core/url_util.cpp" ;;
              test_playback_resolve)
                extra="native/core/api/playback_resolve.cpp native/core/url_util.cpp" ;;
              test_player_engine)
                extra="native/feature/player/engine.cpp native/feature/player/hw_decoder.cpp native/feature/player/ffmpeg_decoder.cpp native/feature/player/subtitle.cpp native/feature/player/playback_policy.cpp native/core/url_util.cpp" ;;
              test_range_cache)
                # player_log.cpp：RangeCache 用注入的日志打"慢取流/慢加锁"（未注入时为空实现）
                extra="native/feature/player/range_cache.cpp native/feature/player/range_fetcher.cpp native/feature/player/player_log.cpp" ;;
              test_library_admin_api)
                extra="native/core/api/library_admin_api.cpp native/core/url_util.cpp" ;;
              test_item_metadata_api)
                # 条目元数据：请求构造 + 整体替换的字段完整性
                # （POST /Items/{id} 少带字段 = 服务端清空，ProviderIds 缺失 = 500）
                extra="native/core/api/item_metadata_api.cpp native/core/url_util.cpp" ;;
              test_device_profile)
                # 客户端能力声明：决定服务端会不会转码（av1 必须在直接播放列表之外）
                extra="native/core/api/device_profile.cpp" ;;
              test_json_arg)
                # header-only（json_arg.h），无需额外源文件。
                # 守住的是"异常不得从 NAPI 边界逸出"：value() 对 null/类型不符会抛，
                # 而异常逸出 RunAsync 的 worker 线程 = std::terminate。
                extra="" ;;
              test_text_repair)
                # header-only（text_util.h / json_dump.h），无需额外源文件。
                # 守住的是"解析响应体前必须先收敛非法 UTF-8"：parse() 对 GBK 等非法字节
                # 会抛 parse_error.101，一抛整份响应就变成 "JSON parse error"。
                extra="" ;;
              test_image_cache)
                # 只依赖注入的下载函数（ImageDownloadFn），不需要 HttpClient/mbedTLS：
                # 守住的是淘汰的触发频率与代价（旧实现每下载一张图就做一次 O(n²) 目录扫描，
                # 且都在取图请求共用的锁内）、LRU、在途去重，以及"错误必须显式"。
                extra="native/core/image_cache.cpp" ;;
              test_socket_util)
                # socket_util.h 是 header-only（WaitSocketReady 为 inline），无需额外源文件。
                # 守住的是"别再用 select()/FD_SET"：OpenHarmony 的 FD_SET 对 fd>=1024 直接 abort，
                # 而本应用 fd 上限是 32768（曾导致详情页约 20 秒必崩）。
                extra="" ;;
              *)
                echo "::error::新增的测试 $name 尚未在本工作流登记编译源文件"
                fail=1
                continue ;;
            esac

            echo "==> 编译并运行 $name"
            # -pthread：RangeCache 现在含后台预取线程（std::thread），链接需要 pthread
            g++ -std=c++17 -pthread $INC "$test_src" $extra -o "$OUT/$name"
            "$OUT/$name"
          done

          exit "$fail"

  build:
    name: 编译校验（debug，未签名）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build HAP
        id: build
        uses: ./.github/actions/build-hap
        with:
          build-mode: debug

      # 编译校验顺带守住"软件自带 FFmpeg"这条线：HAP 里必须带着 FFmpeg 五个库，
      # 且 libjellyfin_native.so 的 DT_NEEDED 依赖闭包在包内完整。
      # 少了 FFmpeg 的产物不会编译失败、也能正常启动，只会在硬解不了的媒体上丢掉软解能力，
      # 属于典型的"静默能力缺失"，因此在这里显式卡住（校验内容见脚本文件头注释）。
      - name: Verify FFmpeg inside HAP
        run: |
          set -euo pipefail
          bash scripts/verify_hap_ffmpeg.sh "${{ steps.build.outputs.hap-path }}" arm64-v8a x86_64

      # 仓库不含签名材料，CI 产出的是未签名 HAP：仅用于编译校验，无法直接安装
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jellyfin-hmos-debug-unsigned
          path: |
            **/build/**/outputs/**/*.hap
            **/build/**/outputs/**/*.app
            **/build/**/outputs/**/*.hsp
            **/build/**/outputs/**/*.har
          if-no-files-found: error
          retention-days: 14
