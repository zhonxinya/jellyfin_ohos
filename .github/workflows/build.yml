name: HarmonyOS CI

# 触发条件：代码推送、PR 提交、手动触发
on:
  push:
    branches: ["main", "master", "dev", "develop"]
  pull_request:
    branches: ["main", "master", "dev", "develop"]
  workflow_dispatch:

# 最小权限：构建仅需读取仓库内容，上传产物使用 Actions 内置机制而非 GITHUB_TOKEN
permissions:
  contents: read

# 同一分支的重复推送取消上一次未完成的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: C++ 核心单测（主机）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # native/core 的单测是纯主机侧测试（不依赖 HarmonyOS SDK 与设备）：
      # 每个测试文件自带 main()，按需链接被测实现后直接运行。
      - name: Build and run native/core tests
        shell: bash
        run: |
          set -euo pipefail
          INC="-I native/core -I native/core/api -I native/feature/player -I native/third_party -I native/third_party/nlohmann"
          OUT="$(mktemp -d)"
          fail=0

          for test_src in native/core/tests/test_*.cpp; do
            name="$(basename "$test_src" .cpp)"
            case "$name" in
              test_url_util)
                extra="native/core/url_util.cpp" ;;
              test_http_response)
                extra="native/core/http_response.cpp" ;;
              test_image_url)
                extra="native/core/image_url.cpp native/core/url_util.cpp" ;;
              test_items_query)
                # options_parse.cpp：宿主 JSON → ItemsQuery/PlaybackInfoOptions 的容错解析
                # （用 nlohmann 的 value() 会在"键存在但类型不符"时抛异常，见 json_arg.h）
                extra="native/core/api/items_query.cpp native/core/api/options_parse.cpp native/core/url_util.cpp" ;;
              test_playback_resolve)
                extra="native/core/api/playback_resolve.cpp native/core/url_util.cpp" ;;
              test_player_engine)
                extra="native/feature/player/engine.cpp native/feature/player/hw_decoder.cpp native/feature/player/ffmpeg_decoder.cpp native/feature/player/subtitle.cpp native/feature/player/playback_policy.cpp native/core/url_util.cpp" ;;
              test_range_cache)
                # player_log.cpp：RangeCache 用注入的日志打"慢取流/慢加锁"（未注入时为空实现）
                extra="native/feature/player/range_cache.cpp native/feature/player/range_fetcher.cpp native/feature/player/player_log.cpp" ;;
              test_library_admin_api)
                extra="native/core/api/library_admin_api.cpp native/core/url_util.cpp" ;;
              test_device_profile)
                # 客户端能力声明：决定服务端会不会转码（av1 必须在直接播放列表之外）
                extra="native/core/api/device_profile.cpp" ;;
              test_json_arg)
                # header-only（json_arg.h），无需额外源文件。
                # 守住的是"异常不得从 NAPI 边界逸出"：value() 对 null/类型不符会抛，
                # 而异常逸出 RunAsync 的 worker 线程 = std::terminate。
                extra="" ;;
              test_image_cache)
                # 只依赖注入的下载函数（ImageDownloadFn），不需要 HttpClient/mbedTLS：
                # 守住的是淘汰的触发频率与代价（旧实现每下载一张图就做一次 O(n²) 目录扫描，
                # 且都在取图请求共用的锁内）、LRU、在途去重，以及"错误必须显式"。
                extra="native/core/image_cache.cpp" ;;
              test_socket_util)
                # socket_util.h 是 header-only（WaitSocketReady 为 inline），无需额外源文件。
                # 守住的是"别再用 select()/FD_SET"：OpenHarmony 的 FD_SET 对 fd>=1024 直接 abort，
                # 而本应用 fd 上限是 32768（曾导致详情页约 20 秒必崩）。
                extra="" ;;
              *)
                echo "::error::新增的测试 $name 尚未在本工作流登记编译源文件"
                fail=1
                continue ;;
            esac

            echo "==> 编译并运行 $name"
            # -pthread：RangeCache 现在含后台预取线程（std::thread），链接需要 pthread
            g++ -std=c++17 -pthread $INC "$test_src" $extra -o "$OUT/$name"
            "$OUT/$name"
          done

          exit "$fail"

  lint:
    name: 代码规范检查（编译警告 + ArkTS lint）
    runs-on: ubuntu-latest
    env:
      # 自有源码的 include 路径。third_party 的路径分开列，因为它们不参与"警告"检查。
      LINT_INC: >-
        -I native/core -I native/core/api -I native/feature/player
        -I native/third_party -I native/third_party/nlohmann
        -I native/third_party/mbedtls/include
        -I native/third_party/ffmpeg/include -I native/third_party/dav1d/include
      # 需要 OHOS SDK 头、在 ubuntu 上无法解析的自有源码。
      # 这不是"被放过"：它们仍然在 build 任务里由真实工具链编译，只是不参与本步骤的
      # 警告扫描（缺头会变成 fatal error，与警告混在一起没有信息量）。
      # 清单是实测得出的 —— 无 sysroot 时 47 个自有 .cpp 可编，恰好这 4 个不行。
      LINT_OHOS_ONLY: >-
        native/app/entry/src/main/cpp/napi_init.cpp
        native/napi/jellyfin_napi.cpp
        native/feature/player/egl_renderer.cpp
        native/feature/player/xcomponent_bridge.cpp
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ── 1) 自有源码的编译警告 ───────────────────────────────────────────────
      # 为什么单独做一遍而不用 build 任务的输出：CMake 那边已给自有源码加了
      # -Wall -Wextra -Wpedantic（见 CMakeLists.txt），但 hvigor 的构建日志很长、
      # 警告容易淹没在输出里；这里把"有输出即失败"独立成一步，问题不会被漏看。
      #
      # 为什么加 -DJELLYFIN_HAS_FFMPEG=1：不定义它时，源码里 `#if !defined(...)` 的
      # 那半个文件根本不会被编译，**未使用参数之类的真实警告会被静默跳过**。
      # （这正是本仓库踩过的坑：不定义该宏扫描时，soft_decode_session.cpp 会报出
      # 3 个假的"未使用参数"，而定义后为 0 警告。）
      - name: 自有源码编译警告（-Wall -Wextra -Wpedantic）
        shell: bash
        run: |
          set -euo pipefail
          # 用空格包起来，配合下面 case 做整词匹配，避免 napi.cpp 误命中 jellyfin_napi.cpp
          skip=" $(echo $LINT_OHOS_ONLY) "
          checked=0
          fail=0
          while IFS= read -r f; do
            case "$skip" in
              *" $f "*) echo "跳过（需 OHOS 头，改由 build 任务编译）: $f"; continue ;;
            esac
            checked=$((checked + 1))
            out="$(g++ -std=c++17 -DJELLYFIN_HAS_FFMPEG=1 \
                    -Wall -Wextra -Wpedantic -fsyntax-only $LINT_INC "$f" 2>&1 || true)"
            if [[ -n "$out" ]]; then
              echo "::error file=$f::编译警告或错误"
              echo "$out"
              fail=1
            fi
          done < <(git ls-files native | grep -E '\.cpp$' | grep -v '^native/third_party/')
          echo "已检查 $checked 个自有源文件"
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::自有源码存在编译警告，请按上面的位置修正"
          fi
          exit "$fail"

      # ── 2) ArkTS 侧 lint（鸿蒙官方 codelinter）─────────────────────────────
      # 此前 ETS 完全没有任何静态检查。接入后按**基线**门禁（而非按级别）：
      #
      # 为什么不直接用 codelinter 的 -e/--exit-on：实测**不起作用** ——
      #   -e error / warn / suggestion / error,warn,warn,suggestion 四种取值下退出码皆为 0，
      #   当前 181 条全是 warn 级，所以没有任何一个 -e 取值能让它失败。
      # 因此这里自己比对 native/app/codelinter-baseline.json：
      #   规则数量增加 -> 失败；总数下降 -> 通过并提示同步下调基线；一致 -> 通过。
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 复用 build-hap 的同一份缓存键（tools-version 与那边默认值一致），
      # 所以两个任务不会各下一份 ~2GB 的工具链
      - name: Cache Command Line Tools
        id: cache-tools
        uses: actions/cache@v6
        with:
          path: ./command-line-tools
          key: ${{ runner.os }}-harmony-tools-6.1.0.816

      - name: Download Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VER="6.1.0.816"
          URL="https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-${VER}/commandline-tools-linux-x64-${VER}.zip"
          echo "下载鸿蒙命令行工具链: $URL"
          curl -fL --retry 3 --retry-delay 5 -o tools.zip "$URL"
          unzip -q tools.zip
          rm -f tools.zip

      # ── 2) clang-tidy（仓库自带的 native/app/.clang-tidy）────────────────────
      # 该 `.clang-tidy` 此前从未被任何构建或 CI 执行过（CMake 里只留了一个默认关闭的
      # 开关），等于摆设。这里把它真正跑起来。
      #
      # 用 CLT 自带的 clang-tidy（与工具链同源，保证 check 名称一致）：
      # 直接调绝对路径，不把 tools/bin 加进 PATH（那里有 OHOS 版 diff 等会顶掉系统命令）。
      # 因此本步骤必须放在工具链下载**之后**。
      #
      # 实测基线：47 个自有源文件、耗时约 105 秒、0 命中，故可以强制失败。
      # 抽查证明该检查确实有效（故意写一个未使用参数会被 misc-unused-parameters 命中），
      # 不是"永远通过"的空壳。
      #
      # 覆盖范围与上面警告扫描一致（排除需 OHOS 头的 4 个源文件）。
      # 局限（据实说明）：`.clang-tidy` 的 checks 以 NAPI 相关为主（misc-napi-*、
      # capi-version-validation），而那两个 NAPI 文件恰恰需要 OHOS 头、在本任务里编不了；
      # 这条检查真正守住的是 misc-unused-parameters / modernize-use-auto 等通用规则
      # （已据其修掉 10 处 modernize-use-auto）。
      - name: clang-tidy（native/app/.clang-tidy）
        shell: bash
        run: |
          set -euo pipefail
          CLANG_TIDY="$(pwd)/command-line-tools/sdk/default/openharmony/native/llvm/bin/clang-tidy"
          if [ ! -x "$CLANG_TIDY" ]; then
            echo "::error::未找到 clang-tidy($CLANG_TIDY)，请检查工具链版本"
            exit 1
          fi

          # 取仓库自己的 checks 清单，保证 CI 与本地/IDE 看到同一套规则
          CHECKS="$(grep -o "Checks: *'[^']*'" native/app/.clang-tidy | sed "s/Checks: *'//; s/'$//")"
          echo "checks: $CHECKS"

          # 用空格包起来做整词匹配，避免 napi.cpp 误命中 jellyfin_napi.cpp
          skip=" $(echo $LINT_OHOS_ONLY) "
          checked=0
          fail=0
          while IFS= read -r f; do
            case "$skip" in
              *" $f "*) echo "跳过（需 OHOS 头）: $f"; continue ;;
            esac
            checked=$((checked + 1))
            # 只留自有代码的告警：vendored 头产生的告警会被标为 non-user code，
            # 过滤掉它们，避免淹没真正要看的问题。
            out="$("$CLANG_TIDY" --checks="$CHECKS" "$f" -- \
                    -std=c++17 -DJELLYFIN_HAS_FFMPEG=1 $LINT_INC 2>&1 \
                  | grep -E "^/.*(warning|error):" || true)"
            if [ -n "$out" ]; then
              echo "::error file=$f::clang-tidy 告警"
              echo "$out"
              fail=1
            fi
          done < <(git ls-files native | grep -E '\.cpp$' | grep -v '^native/third_party/')
          echo "clang-tidy 已检查 $checked 个自有源文件（基线 0 命中）"
          exit "$fail"

      # codelinter 会从被检查路径向上找第一个含 `build-profile.json5` 的目录作为"工程根"，
      # 找不到就直接报 "The entered inspection path is incorrect, please make sure this path
      # is under the project path." 并 exit 1（不产出任何报告）。
      #
      # 而 `native/app/build-profile.json5` 被 .gitignore 排除（内含本机证书路径与密码），
      # 在干净 checkout 里**根本不存在** —— 所以本步骤不是可选的：
      # 缺了它，codelinter 连启动都做不到，与"lint 是否通过"无关。
      # 复用 build-hap 的同一份无签名配置（不含 signingConfigs，可安全用于 CI）。
      # 实测只需这一个文件：codelinter 靠 DEVECO_SDK_HOME 定位 ArkTS 声明，
      # 不读 local.properties，故这里不额外生成它。
      - name: 生成 CI 工程配置（codelinter 需要 build-profile.json5 才能定位工程根）
        shell: bash
        run: |
          set -euo pipefail
          cp native/app/build-profile.ci.json5 native/app/build-profile.json5

      - name: ArkTS lint（codelinter + 基线比对）
        shell: bash
        working-directory: native/app
        run: |
          set -euo pipefail
          TOOLS_DIR="$(cd ../.. && pwd)/command-line-tools"
          # 不把 "$TOOLS_DIR/bin" 加进 PATH：那个目录里有 OHOS 版的 diff 等工具，
          # 会把系统同名命令顶掉。这里按绝对路径调用。
          CODELINTER="$TOOLS_DIR/bin/codelinter"
          if [ ! -x "$CODELINTER" ]; then
            echo "::error::未找到 codelinter($CODELINTER)，请检查工具链版本是否仍自带该工具"
            ls "$TOOLS_DIR/bin" || true
            exit 1
          fi

          # codelinter 需要 SDK 定位 ArkTS 声明（与 hvigor 用同一套环境变量）
          export DEVECO_SDK_HOME="$TOOLS_DIR/sdk"
          export HOS_SDK_HOME="$TOOLS_DIR/sdk"

          "$CODELINTER" entry/src/main/ets -f json -o codelinter-report.json

          python3 - <<'PY'
          import json, collections, os, sys

          report, baseline_path = "codelinter-report.json", "codelinter-baseline.json"
          data = json.load(open(report, encoding="utf-8"))
          base = json.load(open(baseline_path, encoding="utf-8"))

          by_rule, by_sev, files = collections.Counter(), collections.Counter(), 0
          # rule -> [(相对路径:行, ...)]：只为了在"变差"时直接给出可跳转的位置。
          # 没有它，失败信息只有"某规则由 N 升至 M"，拿到 CI 上根本无法定位是哪个文件
          # （曾因此多花一轮 CI 才查明）。
          locs = collections.defaultdict(list)
          for entry in data:
              fp = entry.get("filePath") or "?"
              try:
                  rel = os.path.relpath(fp)
              except ValueError:
                  rel = fp
              msgs = entry.get("messages") or []
              if msgs:
                  files += 1
              for m in msgs:
                  rule = m.get("rule", "?")
                  by_rule[rule] += 1
                  by_sev[m.get("severity", "?")] += 1
                  locs[rule].append(f"{rel}:{m.get('line', '?')}")
          total = sum(by_rule.values())
          base_rules = {k: v for k, v in (base.get("byRule") or {}).items()}

          lines = [f"### ArkTS lint：{total} 条 / {files} 个文件",
                   f"（基线 {base.get('total', 0)} 条 / {base.get('files', 0)} 个文件）", ""]

          # 1) 是否有规则条目新增，或某条规则数量上涨
          regressions = []
          for rule, count in sorted(by_rule.items()):
              if rule not in base_rules:
                  regressions.append(f"`{rule}` 新增 {count} 条")
              elif count > base_rules[rule]:
                  regressions.append(f"`{rule}` 由 {base_rules[rule]} 升至 {count}")

          # 2) 是否有规则被修完（提示同步下调基线）
          improvements = [f"`{r}` 由 {c} 降至 {by_rule.get(r, 0)}"
                          for r, c in sorted(base_rules.items()) if by_rule.get(r, 0) < c]

          lines += ["| 规则 | 当前 | 基线 |", "| --- | --- | --- |"]
          for rule in sorted(set(by_rule) | set(base_rules)):
              lines.append(f"| `{rule}` | {by_rule.get(rule, 0)} | {base_rules.get(rule, 0)} |")
          if by_sev:
              lines += ["", "按严重级：" + "、".join(f"{k} {v}" for k, v in by_sev.most_common())]

          summary = "\n".join(lines)
          print(summary)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as fh:
              fh.write(summary + "\n")

          if regressions:
              print("\n::error::ArkTS lint 比基线变差：")
              for r in regressions:
                  print(f"  - {r}")
              # 逐条给出文件位置：CI 失败信息只有"某规则由 N 升至 M"时无法定位，
              # 必须再拉一次日志才能查。这里直接打印，并额外发 GitHub 注解
              # （workflow 命令需逐行输出才能被解析，故不放进上面的字符串）。
              for rule in sorted(by_rule):
                  if rule not in base_rules:
                      delta = locs[rule]
                  elif by_rule[rule] > base_rules[rule]:
                      # 只报超出的部分，避免把基线内已有的旧问题一起刷屏
                      delta = locs[rule][base_rules[rule]:]
                  else:
                      continue
                  print(f"\n  [{rule}] 新增 {len(delta)} 处：")
                  for loc in delta:
                      print(f"    {loc}")
                      print(f"::error file={loc.rsplit(':', 1)[0]},line={loc.rsplit(':', 1)[1]},title=ArkTS lint::{rule}")
              print("\n请修正上述问题，或在确认属误报后调整 codelinter-baseline.json")
              sys.exit(1)

          if improvements:
              print("\n提示：以下规则已比基线减少，请把 native/app/codelinter-baseline.json 调小以固化改进：")
              for i in improvements:
                  print(f"  - {i}")
          PY

  build:
    name: 编译校验（debug，未签名）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build HAP
        id: build
        uses: ./.github/actions/build-hap
        with:
          build-mode: debug

      # 编译校验顺带守住"软件自带 FFmpeg"这条线：HAP 里必须带着 FFmpeg 五个库，
      # 且 libjellyfin_native.so 的 DT_NEEDED 依赖闭包在包内完整。
      # 少了 FFmpeg 的产物不会编译失败、也能正常启动，只会在硬解不了的媒体上丢掉软解能力，
      # 属于典型的"静默能力缺失"，因此在这里显式卡住（校验内容见脚本文件头注释）。
      - name: Verify FFmpeg inside HAP
        run: |
          set -euo pipefail
          bash scripts/verify_hap_ffmpeg.sh "${{ steps.build.outputs.hap-path }}" arm64-v8a x86_64

      # 仓库不含签名材料，CI 产出的是未签名 HAP：仅用于编译校验，无法直接安装
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jellyfin-hmos-debug-unsigned
          path: |
            **/build/**/outputs/**/*.hap
            **/build/**/outputs/**/*.app
            **/build/**/outputs/**/*.hsp
            **/build/**/outputs/**/*.har
          if-no-files-found: error
          retention-days: 14
