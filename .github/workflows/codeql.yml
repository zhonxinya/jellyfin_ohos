# CodeQL 高级设置（advanced setup）
#
# 使用高级设置而非默认设置，原因与参考项目一致：默认设置无法按路径排除，
# 而本仓库需要把 vendored 第三方源码（`native/third_party/`）排除在分析之外，
# 因此改为高级设置并引用 `.github/codeql/codeql-config.yml`。
#
# 语言与构建模式：
# - `actions`：扫描本仓库的 GitHub Actions 工作流；
# - `c-cpp`：扫描 `native/core`、`native/player`、`native/napi`；
# - `javascript-typescript`：扫描 hvigor 配置脚本（`*.ts`）与仓库内脚本。
# 三种语言均不构建（`build-mode: none`）：本项目为 HarmonyOS/hvigor 工程，
# 编译需要鸿蒙 NDK 与命令行工具链，CodeQL 无法直接驱动其构建流程。
name: "CodeQL Advanced"

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: '38 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # 上传分析结果所需
      security-events: write
      # 私有仓库下 github/codeql-action/analyze 读取作业运行状态所需
      actions: read
      # 读取仓库内容
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
