name: Build HarmonyOS HAP
description: 准备鸿蒙命令行工具链与无签名工程配置，在 native/app 执行 hvigor 构建并输出 HAP 路径

inputs:
  build-mode:
    description: 构建模式（debug / profile / release）
    required: false
    default: debug
  tools-version:
    description: 鸿蒙命令行工具链版本（对应 commandline-tools-linux-x64 发布包）
    required: false
    default: '6.1.0.816'
  product:
    description: 产品/目标名（对应 build-profile 里的 product 与 entry 的 target）
    required: false
    default: default

outputs:
  hap-path:
    description: 构建产出的 HAP 文件绝对路径
    value: ${{ steps.build.outputs.hap-path }}
  unsigned:
    description: 是否产出未签名 HAP（本仓库 CI 恒为 true）
    value: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    # 工具链约 2GB，缓存命中可省去大量下载时间
    - name: Cache Command Line Tools
      id: cache-tools
      uses: actions/cache@v6
      with:
        path: ./command-line-tools
        key: ${{ runner.os }}-harmony-tools-${{ inputs.tools-version }}

    - name: Download Command Line Tools
      if: steps.cache-tools.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        VER="${{ inputs.tools-version }}"
        URL="https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-${VER}/commandline-tools-linux-x64-${VER}.zip"
        echo "下载鸿蒙命令行工具链: $URL"
        curl -fL --retry 3 --retry-delay 5 -o tools.zip "$URL"
        unzip -q tools.zip
        rm -f tools.zip

    - name: Setup Build Environment
      shell: bash
      run: |
        set -euo pipefail
        TOOLS_DIR="$(pwd)/command-line-tools"

        # hvigor 通过 native/app/local.properties 的 hwsdk.dir 定位 SDK
        # （该文件含机器相关路径，已被 .gitignore 排除，不入库）
        echo "hwsdk.dir=$TOOLS_DIR/sdk" > native/app/local.properties

        echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
        echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> "$GITHUB_ENV"
        echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
        echo "DEVECO_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"

        # 工具链自带 JDK（如有）
        if [ -d "$TOOLS_DIR/jbr" ]; then
          echo "JAVA_HOME=$TOOLS_DIR/jbr" >> "$GITHUB_ENV"
        fi

        chmod -R +x "$TOOLS_DIR/bin"

    # 仓库不保存任何签名材料，CI 固定使用无签名配置
    - name: Apply CI Build Profile
      shell: bash
      run: |
        set -euo pipefail
        cp native/app/build-profile.ci.json5 native/app/build-profile.json5
        echo "已生成无签名 native/app/build-profile.json5"

    - name: Install Dependencies
      shell: bash
      working-directory: native/app
      run: ohpm install --all

    - name: Build HAP
      id: build
      shell: bash
      working-directory: native/app
      env:
        PRODUCT: ${{ inputs.product }}
      run: |
        set -euo pipefail
        hvigorw assembleHap \
          -p "module=entry@${PRODUCT}" \
          -p "product=${PRODUCT}" \
          -p buildMode=${{ inputs.build-mode }} \
          --no-daemon

        # 按产品目录精确取产物：同一工作区里可能先构建过别的产品（例如发布流程先编
        # default 再编 phone），全仓库 find 会随机取到上一个产品的 HAP。
        HAP=$(find "entry/build/${PRODUCT}/outputs" -name '*.hap' -type f 2>/dev/null | head -n 1)
        if [ -z "$HAP" ]; then
          echo "::error::未找到构建产物 HAP（product=${PRODUCT}）"
          find . -name '*.hap' -type f || true
          exit 1
        fi
        echo "构建产物: $HAP"
        echo "hap-path=$(realpath "$HAP")" >> "$GITHUB_OUTPUT"
